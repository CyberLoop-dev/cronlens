<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='320' viewBox='0 0 1200 320' role='img' aria-label='CronLens banner'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#14110f'/><stop offset='1' stop-color='#2e1a0e'/></linearGradient>
    <linearGradient id='ac' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#ff6b35'/><stop offset='1' stop-color='#ffd23f'/></linearGradient>
  </defs>
  <style>
    text { font-family: JetBrains Mono, Fira Code, Consolas, Courier New, monospace; }
    .glow { animation: glow 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes glow { from { opacity: .2; transform: scale(.9); } to { opacity: .6; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none; } }
  </style>
